<!DOCTYPE html>
<html>
<head>
    <style>
        .tabs {
            display: flex;
            gap: 10px;
        }

        .tab-button {
            padding: 10px 20px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
        }

        .tab-button.active {
            background-color: black;
            color: white;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>

<body>

    <div class="tabs">
        <button class="tab-button active" onclick="showTab('home')">
            Home
        </button>

        <button class="tab-button" onclick="showTab('about')">
            About
        </button>

        <button class="tab-button" onclick="showTab('contact')">
            Contact
        </button>
    </div>

    <div id="home" class="tab-content active">
        <h2>Home</h2>
        <p>This is the home content.</p>
    </div>

    <div id="about" class="tab-content">
        <h2>About</h2>
        <p>This is the about content.</p>
    </div>

    <div id="contact" class="tab-content">
        <h2>Contact</h2>
        <p>This is the contact content.</p>
    </div>

    <script>
        function showTab(tabName) {

            // Hide all content
            document.querySelectorAll('.tab-content').forEach(function(tab) {
                tab.classList.remove('active');
            });

            // Remove active from all buttons
            document.querySelectorAll('.tab-button').forEach(function(button) {
                button.classList.remove('active');
            });

            // Show selected content
            document.getElementById(tabName).classList.add('active');

            // Make clicked button active
            event.target.classList.add('active');
        }
    </script>

    <div style= "height: 100vm>
    </div>

</body>
</html>
